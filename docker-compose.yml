# The site's stack on an Owwsolution platform VM (Owwsolution/platform): the edge proxy (Caddy) and
# PostgreSQL belong to the platform and are shared by every app on the VM, so this file has
# neither. Every service runs in its own container; nothing is published on the host.
#
#   deploy   CI sends this file and deploy/anthonyzng-web.caddy to /opt/apps/anthonyzng-web/.incoming
#            (the platform's scripts/receive-incoming, each on stdin) and runs the platform's
#            scripts/deploy-app (this commit's images, `up -d`, the snippet)
#   locally  docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#            on a local platform stack (CLAUDE.md section 6, "Full stack")
#
# Production runs the images CI pushed to GHCR (private packages): IMAGE_TAG is the commit SHA the
# deploy passes, `latest` otherwise (the last deployed build). This file has no `build` section:
# deploy-app never builds and refuses one; the local override adds them (images tagged `:local`).
#
# Networks: this app's own two on the platform, both internal (no route to the internet) and
# joined by no other app; this file may name no other (the platform's deploy-app checks it):
#   edge  edge-anthonyzng-web (created by deploy-app): Caddy reaches the frontend and the backend
#         under the aliases anthonyzng-web-frontend and anthonyzng-web-backend, the names
#         deploy/anthonyzng-web.caddy uses
#   db    db-anthonyzng-web (created by provision-app): the platform's PostgreSQL, as
#         platform-postgres
# The backend also keeps the project's default network, its only route out (Turnstile, Resend).
#
# Configuration:
#   .env           DATABASE_OWNER_URL and DATABASE_APP_URL, written by the platform's
#                  `scripts/provision-app anthonyzng-web --scheme postgresql+asyncpg --write-env`;
#                  see .env.example.
#   backend/.env   backend settings (secrets); see backend/.env.example. DATABASE_URL and
#                  TRUSTED_PROXY are set here instead.
# Both files are git-ignored. Migrations run once per `up` in the `migrate` service, before the
# backend starts; the app itself never migrates.
name: anthonyzng-web

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  pids_limit: 200

# Memory caps (platform spec section 7): one runaway service is killed and restarted instead of
# pressing on the rest of the VM. The backend's peak is two Argon2 checks (19 MiB each) plus one
# cover-image decode.

services:
  backend:
    <<: *hardening
    image: ghcr.io/anthonyzng/anthonyzng-web-backend:${IMAGE_TAG:-latest}
    env_file:
      - path: ./backend/.env
        required: true
    # Merged into migrate's environment too. Values with a $variable belong in `environment` values (or `image`) only
    # (deploy-app refuses one in any other place, an x- extension included).
    environment: &backend-env
      # Production unless the local override says otherwise, so a backend/.env that lost its
      # APP_ENV line can never start with development defaults (no Secure cookie, API docs).
      APP_ENV: ${APP_ENV:-production}
      # The least-privilege app role (rows only: the platform's default privileges grant them),
      # never the schema owner.
      DATABASE_URL: ${DATABASE_APP_URL:?set DATABASE_APP_URL in .env (the platform's provision-app)}
      # Behind Caddy: the client IP is the rightmost X-Forwarded-For entry.
      TRUSTED_PROXY: "true"
    read_only: true
    cap_drop: [ALL]
    mem_limit: 384m
    tmpfs:
      - /tmp
    networks:
      # default: outbound HTTPS (Turnstile, Resend)
      default:
      edge:
        aliases: [anthonyzng-web-backend]
      db:
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-off: brings the schema to head as the schema owner, then checks the app role's rights
  # (`app.db_roles`), then exits; the backend waits for it to succeed. It runs the backend's image
  # (pulled by deploy-app, or built by the local override's `backend`, never on its own).
  migrate:
    <<: *hardening
    image: ghcr.io/anthonyzng/anthonyzng-web-backend:${IMAGE_TAG:-latest}
    pull_policy: never
    restart: "no"
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      <<: *backend-env
      DATABASE_URL: ${DATABASE_OWNER_URL:?set DATABASE_OWNER_URL in .env (the platform's provision-app)}
      DATABASE_APP_USER: ${DATABASE_APP_USER:-anthonyzng_web_app}
    command: ["sh", "-c", "alembic upgrade head && python -m app.db_roles"]
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    mem_limit: 256m
    networks:
      - db

  frontend:
    <<: *hardening
    image: ghcr.io/anthonyzng/anthonyzng-web-frontend:${IMAGE_TAG:-latest}
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m
    tmpfs:
      - /tmp
    networks:
      edge:
        aliases: [anthonyzng-web-frontend]

networks:
  edge:
    external: true
    name: edge-anthonyzng-web
  db:
    external: true
    name: db-anthonyzng-web
