# The production stack: every service in its own container, only the proxy is published.
#
#   docker compose pull backend frontend && docker compose up -d   # production (the VM; CI deploys)
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build   # locally
#
# Production runs the images CI pushed to GHCR (private packages): IMAGE_TAG is the commit SHA the
# deploy job passes, `latest` otherwise (the last build of main). The `build` sections are for
# local builds (the local override retags them `:local`).
#
# Configuration:
#   .env           Compose variables (Postgres credentials, public addresses, frontend build args);
#                  see .env.example.
#   backend/.env   backend settings (secrets); see backend/.env.example. DATABASE_URL and
#                  TRUSTED_PROXY are set here instead, for the container network.
# Both files are git-ignored. Migrations run once per `up` in the `migrate` service, before the
# backend starts; the app itself never migrates.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  pids_limit: 200

# Memory caps sized for the 1 GiB e2-micro (plus 2 GiB swap): one runaway service is killed and
# restarted instead of taking PostgreSQL down with it. The backend's peak is two Argon2 checks
# (19 MiB each) plus one cover-image decode.

x-backend-env: &backend-env
  # Production unless the root .env (or the local override) says otherwise, so a backend/.env that
  # lost its APP_ENV line can never start with development defaults (no Secure cookie, API docs).
  APP_ENV: ${APP_ENV:-production}
  # Inside the network the database is `db`. The backend connects as the least-privilege app role
  # (rows only, set up by `migrate`), never as the schema owner. Passwords must be URL-safe
  # (letters, digits, - _ . ~).
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-anthonyzng_app}:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@db:5432/${POSTGRES_DB:-anthonyzng_web} # ggignore (Compose variables, no value)
  # Behind Caddy: the client IP is the rightmost X-Forwarded-For entry.
  TRUSTED_PROXY: "true"

services:
  db:
    <<: *hardening
    image: postgres:17-alpine
    mem_limit: 256m
    # PostgreSQL's entrypoint needs its default capabilities (chown / setuid to the postgres user).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anthonyzng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-anthonyzng_web}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anthonyzng} -d ${POSTGRES_DB:-anthonyzng_web}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: brings the schema to head as the schema owner, then creates or updates the backend's
  # app role and grants it row privileges on every table (`app.db_roles`), then exits; the backend
  # waits for it to succeed. It runs the backend's image (pulled or built by the `backend`
  # service, never on its own).
  migrate:
    <<: *hardening
    image: ghcr.io/anthonyzng/anthonyzng-web-backend:${IMAGE_TAG:-latest}
    pull_policy: never
    restart: "no"
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anthonyzng}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-anthonyzng_web} # ggignore
      DATABASE_APP_USER: ${POSTGRES_APP_USER:-anthonyzng_app}
      DATABASE_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    command: ["sh", "-c", "alembic upgrade head && python -m app.db_roles"]
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *hardening
    image: ghcr.io/anthonyzng/anthonyzng-web-backend:${IMAGE_TAG:-latest}
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: true
    environment: *backend-env
    read_only: true
    cap_drop: [ALL]
    mem_limit: 384m
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    <<: *hardening
    image: ghcr.io/anthonyzng/anthonyzng-web-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        # Required: the build fails on an empty value (set them in .env; the local override does).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m
    tmpfs:
      - /tmp

  proxy:
    <<: *hardening
    image: caddy:2.11-alpine
    # Runs as root inside its container: only the right to bind ports 80 / 443 is kept.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-owwsolution.com}
      SITE_URL: ${SITE_URL:-https://owwsolution.com}
      WWW_ADDRESS: ${WWW_ADDRESS:-www.owwsolution.com}
      API_ADDRESS: ${API_ADDRESS:-api.owwsolution.com}
      API_URL: ${API_URL:-https://api.owwsolution.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # /etc/caddy/site.d/ is empty here; the local override adds a route there.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
