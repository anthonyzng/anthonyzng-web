# CI on every pull request and push to main; on main it also builds the images, pushes them to
# GHCR (private packages) and deploys them to the VM over SSH. The VM runs the Owwsolution platform
# (the private Owwsolution/platform repo: Caddy, PostgreSQL, scripts/deploy-app); this public repo
# cannot call that repo's reusable workflows, so it keeps its own and runs the same deploy-app.
#
# Repository settings used (Settings → Secrets and variables → Actions):
#   variables  DEPLOY_ENABLED ("true" turns on images + deploy), DEPLOY_HOST, DEPLOY_USER,
#              VITE_API_BASE_URL, VITE_TURNSTILE_SITE_KEY (public values compiled into the bundle)
#   secrets    DEPLOY_SSH_KEY (private key of the deploy user), DEPLOY_KNOWN_HOSTS (the VM's host key):
#              secrets of the `production` environment, which only `main` may deploy from, so a pull
#              request (even one that edits this file) can never read them
# The VM holds the app's .env and backend/.env in /opt/apps/anthonyzng-web; no application secret
# passes through GitHub.

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Only this setting comes from the environment in tests (tests/conftest.py).
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --frozen --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -q

  # The container configuration parses: Compose (the three files) and the Caddy snippet, validated
  # inside a copy of the platform's global Caddyfile (deploy/ci/Caddyfile) with production's
  # addresses and with the local ones. The platform validates it again, against the live config,
  # before every install (scripts/install-site).
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The platform's Caddy image (Owwsolution/platform docker-compose.yml): bump them together.
      CADDY_IMAGE: caddy:2.11-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose files
        env:
          # CI-only placeholders (never real secrets) so Compose can interpolate: the two URLs for
          # docker-compose.yml, the password for docker-compose.dev.yml.
          DATABASE_OWNER_URL: postgresql+asyncpg://ci:ci-placeholder@platform-postgres:5432/ci
          DATABASE_APP_URL: postgresql+asyncpg://ci:ci-placeholder@platform-postgres:5432/ci
          POSTGRES_PASSWORD: ci-placeholder
        run: |
          set -euo pipefail
          umask 077
          touch backend/.env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          # On the platform the app runs its own services only (Caddy and PostgreSQL are the
          # platform's), and never a build or a published port (deploy-app refuses both).
          services=$(docker compose config --services | sort | tr '\n' ' ')
          if [ "$services" != "backend frontend migrate " ]; then
            echo "docker-compose.yml defines: ${services}(expected: backend frontend migrate)" >&2
            exit 1
          fi
          docker compose config --format json --no-interpolate \
            | jq -e '[.services[] | has("build") or has("ports")] | any | not' >/dev/null \
            || { echo "docker-compose.yml has a build or ports section" >&2; exit 1; }
      - name: Caddy snippet
        run: |
          set -euo pipefail
          umask 077
          validate() {
            docker run --rm "$@" \
              -v "$PWD/deploy/ci/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -v "$PWD/deploy/anthonyzng-web.caddy:/etc/caddy/sites/anthonyzng-web.caddy:ro" \
              "$CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          }
          validate                                     # production's addresses
          validate --env-file deploy/local-caddy.env   # the local ones
          docker run --rm -v "$PWD/deploy:/deploy:ro" "$CADDY_IMAGE" sh -c \
            'caddy fmt /deploy/anthonyzng-web.caddy | diff /deploy/anthonyzng-web.caddy - && caddy fmt /deploy/ci/Caddyfile | diff /deploy/ci/Caddyfile -'

  images:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [frontend, backend, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
          # The backend ignores them; the frontend build fails if either is empty.
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    # deploy-app waits up to 180 s for the stack; every smoke request is bounded below.
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      APP: anthonyzng-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in step with the SSH setup and the copy step of Owwsolution/platform's
      # .github/workflows/deploy.yml (and the platform's own ci-cd.yml): same key handling (the key
      # only in this step's env and ~/.ssh with mode 600, the host key pinned and never learned,
      # removed again at the end) and the same ssh options.
      - name: SSH key and pinned host key
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::error::the repository variables DEPLOY_HOST / DEPLOY_USER are not set"
            exit 1
          fi
          # Values that end up in an ssh config file: nothing that could add a line or an option.
          if ! [[ $DEPLOY_HOST =~ ^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$ ]] ||
            ! [[ $DEPLOY_USER =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]; then
            echo "::error::DEPLOY_HOST / DEPLOY_USER is not a plain host name or user name"
            exit 1
          fi
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS missing: the production environment must hold both secrets"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          printf '%s\n' \
            'Host deploy-target' \
            "  HostName $DEPLOY_HOST" \
            "  User $DEPLOY_USER" \
            '  IdentityFile ~/.ssh/deploy_key' \
            '  IdentitiesOnly yes' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' \
            '  GlobalKnownHostsFile /dev/null' \
            '  StrictHostKeyChecking yes' \
            '  BatchMode yes' \
            '  ClearAllForwardings yes' \
            '  ForwardAgent no' \
            '  RequestTTY no' \
            '  ConnectTimeout 30' \
            '  ServerAliveInterval 15' >~/.ssh/config
      - name: Copy the app definition
        run: |
          set -euo pipefail
          umask 077
          # Regular files of this checkout only, checked right before they leave the runner: not a
          # symbolic link, and (a link in a directory on the way included) resolving to a place
          # inside the workspace, so no file of the runner (the deploy key) can ever reach the VM.
          workspace=$(realpath -e -- "${GITHUB_WORKSPACE:?}")
          for file in docker-compose.yml "deploy/$APP.caddy"; do
            real=$(realpath -e -- "$file")
            if [ -L "$file" ] || [ ! -f "$file" ] || [[ $real != "$workspace"/* ]]; then
              echo "::error::$file is not a regular file inside the repository"
              exit 1
            fi
          done
          # The platform's receive-incoming takes each file on stdin and puts it into
          # /opt/apps/<app>/.incoming/: the only writes an app's gated deploy key may make on the VM
          # (Owwsolution/platform scripts/ssh-gate); no scp, no shell.
          # shellcheck disable=SC2029 # the arguments are expanded here, on purpose (constants of this job)
          ssh deploy-target "/opt/platform/scripts/receive-incoming $(printf '%q ' --app "$APP" --file compose)" <docker-compose.yml
          # shellcheck disable=SC2029
          ssh deploy-target "/opt/platform/scripts/receive-incoming $(printf '%q ' --app "$APP" --file snippet)" <"deploy/$APP.caddy"
      - name: Pull this commit's images, restart, install the Caddy snippet
        env:
          # Valid only while this job runs; deploy-app logs the VM out right after the pull.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        # The platform's deploy-app: GHCR login and logout, this commit's images tagged `latest`
        # (so every manual compose command on the VM uses the deployed images), `up -d
        # --remove-orphans` (migrate first), the snippet validated with the live Caddy config and
        # installed with a reload, unused images pruned.
        run: |
          set -euo pipefail
          umask 077
          # GHCR names are lower case (deploy-app refuses anything else).
          images="ghcr.io/${REPOSITORY,,}"
          args=(--app "$APP" --sha "$SHA" --registry-user "$ACTOR"
            --image "$images-backend" --image "$images-frontend")
          # The token goes over stdin (printf is a builtin: never in a process list or a log).
          # Every argument is quoted for the VM's shell.
          # shellcheck disable=SC2029 # the arguments are expanded here, on purpose
          printf '%s' "$REGISTRY_TOKEN" | ssh deploy-target "/opt/platform/scripts/deploy-app $(printf '%q ' "${args[@]}")"
      - name: Smoke test
        run: |
          set -euo pipefail
          umask 077
          # HTTPS only, every request bounded.
          get() { curl -fsS --proto '=https' --max-time 10 "$@"; }
          for _ in $(seq 12); do
            if get -o /dev/null https://api.owwsolution.com/api/v1/health && get -o /dev/null https://owwsolution.com/ \
              && get -o /dev/null https://owwsolution.com/admin/login; then
              # Production mode: the API docs must not be served.
              docs=$(curl -s -o /dev/null -w '%{http_code}' --proto '=https' --max-time 10 https://api.owwsolution.com/api/v1/docs || true)
              if [ "$docs" != 404 ]; then echo "API docs answered $docs: not in production mode?" >&2; exit 1; fi
              # The CV download, once one is uploaded (a root-relative path on the API origin; any
              # other shape is refused, so the URL below never names another host). A failed
              # content fetch fails the step (pipefail) instead of skipping the check.
              cv=$(get 'https://api.owwsolution.com/api/v1/content?locale=en' | jq -r '.cv.url // empty')
              if [ -n "$cv" ]; then
                if ! [[ $cv =~ ^/api/v1/files/[0-9a-f-]{36}$ ]]; then
                  echo "unexpected CV URL in the content payload" >&2
                  exit 1
                fi
                if ! get -o /dev/null "https://api.owwsolution.com$cv"; then
                  echo "the CV download failed" >&2
                  exit 1
                fi
              fi
              exit 0
            fi
            sleep 10
          done
          echo "the site did not come back healthy" >&2
          exit 1
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
