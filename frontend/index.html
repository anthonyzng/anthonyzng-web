<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anthony Ng — Full Stack Software Developer, AI Developer, and Assistant Manager in Software Development." />
    <title>Anthony Ng</title>
    <script>
      // Apply the theme before first paint to avoid a light/dark flash.
      // Keep the storage key in sync with src/theme/theme.ts.
      (function () {
        var stored = null
        try {
          stored = localStorage.getItem('theme')
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
