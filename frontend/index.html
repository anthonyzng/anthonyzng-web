<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anthony Ng — Full Stack Software Developer, AI Developer and Assistant Manager, Software Development. Experience, projects, skills and contact." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1120" />
    <title>Anthony Ng</title>
    <!-- Search and link previews. The same for every page, so here (crawlers that run no script
         read it); the language-specific title, description, canonical URL and og:url/og:locale
         are set per page by src/components/DocumentMeta.tsx. -->
    <link rel="alternate" hreflang="en" href="https://owwsolution.com/en" />
    <link rel="alternate" hreflang="zh-Hant" href="https://owwsolution.com/zh-hant" />
    <link rel="alternate" hreflang="x-default" href="https://owwsolution.com/en" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anthony Ng" />
    <meta property="og:title" content="Anthony Ng — Full Stack &amp; AI Developer" />
    <meta property="og:description" content="Full Stack Software Developer, AI Developer and Assistant Manager, Software Development." />
    <meta property="og:url" content="https://owwsolution.com/en" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_HK" />
    <meta property="og:image" content="https://owwsolution.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Anthony Ng — Full Stack &amp; AI Developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Structured data: a data block, never executed, so the CSP needs no allowance for it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Anthony Ng",
        "url": "https://owwsolution.com/en",
        "jobTitle": ["Full Stack Software Developer", "AI Developer", "Assistant Manager, Software Development"],
        "knowsLanguage": ["en", "zh-Hant"],
        "sameAs": ["https://www.linkedin.com/in/anthonyzng/", "https://github.com/anthonyzng"]
      }
    </script>
    <!-- Applies the saved or system theme before first paint (no light/dark flash). A file, not an
         inline script, so the Content-Security-Policy needs no 'unsafe-inline'. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
