# Static server for the SPA, behind Caddy (which adds the security headers and terminates TLS).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Behind the proxy: never build redirects from the container's own host and port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    # Every request arrives through Caddy (with a Via header), which nginx would otherwise not compress.
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    # Hashed build output never changes under the same name.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A file name (a dot in the last segment: /favicon.svg, /robots.txt) is that file or a 404, never
    # the app: a crawler asking for a missing /robots.txt must not get an HTML page with 200.
    location ~ /[^/]*\.[^/]*$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Everything else is a route of the SPA (/en, /zh-hant/..., /admin/...): index.html, always
    # revalidated so a deploy is picked up at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
