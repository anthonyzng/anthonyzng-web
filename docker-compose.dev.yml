# The database alone, for development with the backend and frontend run on the host
# (`uvicorn --reload`, `npm run dev`); the full stack is docker-compose.yml (+ docker-compose.local.yml).
#
#   docker compose -f docker-compose.dev.yml up -d db
#
# Same project, service and volume as the full stack's `db`, so both see the same data. Also
# creates the *_test database for pytest on first start. Credentials come from the git-ignored root
# `.env` (see `.env.example`).
services:
  db:
    image: postgres:17-alpine
    container_name: anthonyzng-web-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anthonyzng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-anthonyzng_web}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the test database next to the main one on first start.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anthonyzng} -d ${POSTGRES_DB:-anthonyzng_web}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
