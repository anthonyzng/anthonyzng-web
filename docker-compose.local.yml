# Runs the site on this machine, on a local platform stack (plain HTTP, no certificates):
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
#   site  http://localhost:8080        API  http://localhost:8080/api/v1 (also http://api.localhost:8080/api/v1)
#
# Needs the platform running locally with this site's database and snippet (CLAUDE.md section 6,
# "Full stack"). Browsers take localhost and api.localhost for two different sites, so the
# admin's SameSite=Lax cookie would not reach api.localhost: the local build calls the API on the
# site's own origin (deploy/local-caddy.env turns that route on in the snippet). The backend keeps
# its development settings from backend/.env; CORS allows the site's origin (used by the
# api.localhost address only). The images are built here and tagged `:local`, so a local build
# never stands in for a GHCR image. The `build` sections live only here: the platform's deploy-app
# never builds and refuses a compose file that has one.

services:
  migrate:
    image: anthonyzng-web-backend:local
    environment:
      APP_ENV: development

  backend:
    image: anthonyzng-web-backend:local
    build: ./backend
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:8080

  frontend:
    image: anthonyzng-web-frontend:local
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        # Cloudflare's public always-pass test key (the backend/.env default secret matches it).
        VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
